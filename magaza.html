<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mağaza - Hisar Roket Takımı</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --img-bg:#0c1119; --bg:#06080c; --panel:#0c1119; --line:rgba(255,255,255,0.09); --ink:#f2f4f8; --mute:#8e98aa; --hot:#ff7a1a; --hot2:#ffc266; --ice:#7fd3ff; }
  :root[data-theme="light"] { --img-bg:#ffffff; --bg:#f5f7fb; --panel:#ffffff; --line:rgba(10,20,40,0.12); --ink:#121a28; --mute:#4a5468; --hot:#e8610c; --hot2:#f29a2e; --ice:#1c6fb3; }
  :root[data-theme="light"] .top { background: rgba(245,247,251,0.85); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: Inter, system-ui, sans-serif; line-height: 1.6; min-height: 100vh; }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 56px 56px; opacity: 0.45; mask-image: radial-gradient(ellipse at top, #000 20%, transparent 75%); }
  .wrap { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 0 24px; }
  a { color: inherit; }
  .display { font-family: "Bebas Neue", Impact, sans-serif; font-weight: 400; letter-spacing: 0.02em; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mute); }

  .top { position: sticky; top: 0; z-index: 20; background: rgba(6,8,12,0.8); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .top .wrap { display: flex; align-items: center; gap: 22px; height: 84px; }
  .top img { height: 64px; width: auto; }
  .top nav { margin-left: auto; display: flex; gap: 22px; }
  .top nav a { color: var(--mute); text-decoration: none; font-size: 0.88rem; font-weight: 500; }
  .top nav a:hover, .top nav a.on { color: var(--ink); }
  .pill { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 6px 12px; font: 600 0.8rem Inter, sans-serif; cursor: pointer; }
  .tools { display: flex; gap: 8px; }

  /* Store */
  .store-head { padding: 70px 0 30px; }
  .store-head h1 { font-size: clamp(3rem, 7vw, 5rem); line-height: 0.95; margin: 10px 0 12px; }
  .store-head p { color: var(--mute); max-width: 640px; margin: 0; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; padding: 30px 0 90px; }
  .card { background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; text-decoration: none; color: inherit; transition: border-color 0.2s, transform 0.2s; }
  a.card:hover { border-color: var(--hot); transform: translateY(-3px); }
  .card .pic { aspect-ratio: 4 / 3; background: var(--img-bg); overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .card .pic img { width: 100%; height: 100%; object-fit: cover; }
  .card .body { padding: 22px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .card h2 { font-family: "Bebas Neue", Impact, sans-serif; font-weight: 400; font-size: 2rem; line-height: 1; margin: 6px 0 4px; }
  .card p { color: var(--mute); font-size: 0.93rem; margin: 0; }
  .card .foot { margin-top: auto; padding-top: 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; border-top: 1px solid var(--line); }
  .card .price { font-family: "Bebas Neue", Impact, sans-serif; font-size: 1.8rem; color: var(--hot); line-height: 1; }
  .card .more { font-family: "JetBrains Mono", monospace; font-size: 0.75rem; letter-spacing: 0.08em; color: var(--ice); text-transform: uppercase; }
  .card.soon { border-style: dashed; align-items: center; justify-content: center; min-height: 340px; text-align: center; padding: 30px; color: var(--mute); }
  .card.soon h2 { color: var(--ink); font-size: 1.8rem; }

  /* Product */
  .crumbs { padding: 22px 0 0; }
  .crumbs a { color: var(--mute); text-decoration: none; font-size: 0.86rem; }
  .crumbs a:hover { color: var(--ink); }
  .product { display: grid; grid-template-columns: 1.1fr 1fr; gap: 56px; padding: 30px 0 60px; align-items: start; }
  .gallery .main { background: var(--img-bg); border: 1px solid var(--line); aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .gallery .main img { width: 100%; height: 100%; object-fit: contain; }
  .thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 12px; }
  .thumbs button { all: unset; cursor: pointer; border: 1px solid var(--line); background: var(--img-bg); aspect-ratio: 4 / 3; overflow: hidden; display: block; opacity: 0.6; transition: opacity 0.2s, border-color 0.2s; }
  .thumbs button img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumbs button.on, .thumbs button:hover { opacity: 1; border-color: var(--hot); }
  .info h1 { font-size: clamp(2.8rem, 6vw, 4.4rem); line-height: 0.95; margin: 10px 0 14px; }
  .info .short { font-size: 1.02rem; margin: 0 0 22px; opacity: 0.92; }
  .price-row { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 20px 0; margin-bottom: 22px; }
  .price-big { font-family: "Bebas Neue", Impact, sans-serif; font-size: 3rem; line-height: 1; color: var(--hot); }
  .lead-time { font-family: "JetBrains Mono", monospace; font-size: 0.8rem; color: var(--mute); letter-spacing: 0.06em; }
  .order { display: inline-block; background: var(--hot); color: #0a0c10; text-decoration: none; font-family: "Bebas Neue", Impact, sans-serif; font-size: 1.35rem; letter-spacing: 0.06em; padding: 14px 36px; clip-path: polygon(14px 0, 100% 0, calc(100% - 14px) 100%, 0 100%); }
  .order:hover { background: var(--hot2); }
  .order-note { color: var(--mute); font-size: 0.88rem; margin: 12px 0 28px; }
  .feat { list-style: none; padding: 0; margin: 0; border: 1px solid var(--line); }
  .feat li { padding: 14px 18px; border-top: 1px solid var(--line); background: var(--panel); font-size: 0.95rem; }
  .feat li:first-child { border-top: 0; }
  .feat li b { color: var(--ink); }

  section.block { position: relative; z-index: 1; padding: 60px 0; border-top: 1px solid var(--line); }
  .sec-head { display: flex; align-items: baseline; gap: 16px; margin-bottom: 28px; }
  .sec-head .num { font-family: "JetBrains Mono", monospace; color: var(--hot); font-size: 0.9rem; }
  .sec-head h2 { font-size: clamp(2rem, 4.5vw, 3rem); margin: 0; line-height: 1; }
  .sec-head::after { content: ""; flex: 1; height: 1px; background: var(--line); align-self: center; }
  table.specs { width: 100%; border-collapse: collapse; border: 1px solid var(--line); background: var(--panel); }
  table.specs th, table.specs td { text-align: left; padding: 14px 18px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 0.95rem; }
  table.specs tr:last-child th, table.specs tr:last-child td { border-bottom: 0; }
  table.specs th { width: 32%; color: var(--mute); font-weight: 500; font-family: "JetBrains Mono", monospace; font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase; }
  .uses { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); }
  .uses > div { padding: 28px; border-right: 1px solid var(--line); background: var(--panel); }
  .uses > div:last-child { border-right: 0; }
  .uses h3 { font-family: "Bebas Neue", Impact, sans-serif; font-weight: 400; font-size: 1.7rem; margin: 8px 0; }
  .uses p { color: var(--mute); margin: 0; font-size: 0.95rem; }

  footer { position: relative; z-index: 1; border-top: 1px solid var(--line); padding: 26px 0; color: var(--mute); font-size: 0.85rem; }

  @media (max-width: 900px) {
    .top nav { display: none; }
    .grid { grid-template-columns: 1fr 1fr; }
    .product { grid-template-columns: 1fr; gap: 32px; }
    .uses { grid-template-columns: 1fr; }
    .uses > div { border-right: 0; border-bottom: 1px solid var(--line); }
    table.specs th { width: 40%; }
  }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
  .order-form { display: grid; gap: 14px; max-width: 560px; }
  .order-form label { display: grid; gap: 6px; font-size: 0.92rem; font-weight: 500; }
  .order-form input, .order-form textarea { font: inherit; padding: 11px 12px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  .order-form textarea { min-height: 90px; resize: vertical; }
  .order-form .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .order-form .err { display: none; color: #e5484d; font-size: 0.82rem; font-weight: 500; }
  .order-form label.invalid .err { display: block; }
  .order-form label.invalid input, .order-form label.invalid textarea { border-color: #e5484d; }
  .order-form button.order { justify-self: start; border: 0; cursor: pointer; }
  .order-form button.order:disabled { opacity: 0.6; cursor: wait; }
  .order-status { font-size: 0.9rem; margin: 0; color: var(--mute); }
  .order-status.ok { color: #2ea86a; }
  .order-status.bad { color: #e5484d; }
  @media (max-width: 560px) { .order-form .row2 { grid-template-columns: 1fr; } }
</style>
</head>

    const specs = p.specs.map(s => `<tr><th>${t(s.k)}</th><td>${t(s.v)}</td></tr>`).join('');
    const uses = p.uses.map(x => `<div><div class="mono">${t(x.tag)}</div><h3>${t(x.title)}</h3><p>${t(x.text)}</p></div>`).join('');
    const subj = encodeURIComponent(t(p.name) + ' - ' + u.subject);
    app.innerHTML = `
      <div class="wrap crumbs"><a href="#">${u.back}</a></div>
      <div class="wrap product">
        <div class="gallery">
          <div class="main"><img id="mainImg" src="${p.images[0]}" alt="${t(p.name)}"></div>
          <div class="thumbs">${thumbs}</div>
        </div>
        <div class="info">
          <div class="mono">${t(p.category)}</div>
          <h1 class="display">${t(p.name)}</h1>
          <p class="short">${t(p.short)}</p>
          <div class="price-row"><div class="price-big">${p.price}</div><div class="lead-time">${t(p.lead)}</div></div>
          ${orderFormHTML(p)}
          <ul class="feat">${feats}</ul>
        </div>
      </div>
      <section class="block"><div class="wrap">
        <div class="sec-head"><span class="num">01</span><h2 class="display">${u.specs}</h2></div>
        <table class="specs">${specs}</table>
      </div></section>
      <section class="block"><div class="wrap">
        <div class="sec-head"><span class="num">02</span><h2 class="display">${u.uses}</h2></div>
        <div class="uses">${uses}</div>
      </div></section>`;
    document.querySelectorAll('.thumbs button').forEach(b => b.addEventListener('click', () => {
      document.getElementById('mainImg').src = b.dataset.src;
      document.querySelectorAll('.thumbs button').forEach(x => x.classList.toggle('on', x === b));
    }));
    setNav('store');
    bindOrderForm(p);
    window.scrollTo(0, 0);
  }


  const OT = {
    tr: { title: 'Sipariş Talebi', name: 'Ad Soyad *', email: 'E-posta', phone: 'Telefon', qty: 'Adet', note: 'Not (isteğe bağlı)', submit: 'Sipariş Talebi Gönder', note2: 'Talebiniz bize e-posta ile ulaşır, sizinle bireysel olarak iletişime geçeriz.', contact: 'E-posta veya telefondan en az birini girin.', required: 'Bu alan zorunludur.', emailErr: 'Geçerli bir e-posta adresi girin.', phoneErr: 'Telefon numarası 10 veya 11 haneli olmalıdır.', qtyErr: 'Adet 1 ile 50 arasında olmalıdır.', ok: 'Talebiniz alındı, en kısa sürede sizinle iletişime geçeceğiz.', error: 'Gönderilemedi, lütfen tekrar deneyin.', sending: 'Gönderiliyor…' },
    en: { title: 'Order Request', name: 'Full Name *', email: 'Email', phone: 'Phone', qty: 'Quantity', note: 'Note (optional)', submit: 'Send Order Request', note2: 'Your request reaches us by email and we will contact you personally.', contact: 'Please provide an email address or a phone number.', required: 'This field is required.', emailErr: 'Please enter a valid email address.', phoneErr: 'Phone number must be 10 or 11 digits.', qtyErr: 'Quantity must be between 1 and 50.', ok: 'Your request has been received. We will contact you soon.', error: 'Could not send. Please try again.', sending: 'Sending…' }
  };
  const WEB3_KEY = 'ae00f873-d805-4c62-a34f-a979aa4ff574';

  function orderFormHTML(p) {
    const o = OT[state.lang];
    return `
      <form class="order-form" id="orderForm" novalidate>
        <input type="hidden" name="access_key" value="${WEB3_KEY}">
        <input type="hidden" name="subject" value="${t(p.name)} - Sipariş Talebi">
        <input type="hidden" name="from_name" value="Hisar Roket Mağaza">
        <input type="hidden" name="product" value="${t(p.name)}">
        <input type="checkbox" name="botcheck" tabindex="-1" autocomplete="off" style="display:none">
        <label>${o.name}<input type="text" name="name" maxlength="80" autocomplete="name"><small class="err"></small></label>
        <div class="row2">
          <label>${o.email}<input type="email" name="email" maxlength="120" autocomplete="email"><small class="err"></small></label>
          <label>${o.phone}<input type="tel" name="phone" inputmode="numeric" maxlength="14" autocomplete="tel"><small class="err"></small></label>
        </div>
        <label>${o.qty}<input type="number" name="quantity" min="1" max="50" value="1"><small class="err"></small></label>
        <label>${o.note}<textarea name="note" maxlength="500"></textarea></label>
        <button class="order" type="submit">${o.submit}</button>
        <p class="order-note">${o.note2}</p>
        <p class="order-status" id="orderStatus" role="status" aria-live="polite"></p>
      </form>`;
  }

  function bindOrderForm(p) {
    const form = document.getElementById('orderForm');
    if (!form) return;
    const f = n => form.querySelector(`[name="${n}"]`);
    const status = document.getElementById('orderStatus');
    const btn = form.querySelector('button[type="submit"]');
    const setErr = (n, msg) => {
      const label = f(n).closest('label');
      label.classList.toggle('invalid', !!msg);
      label.querySelector('.err').textContent = msg || '';
    };
    const fmt = d => {
      const g = d[0] === '0' ? [4, 3, 2, 2] : [3, 3, 2, 2];
      const parts = []; let i = 0;
      for (const n of g) { if (i >= d.length) break; parts.push(d.slice(i, i + n)); i += n; }
      return parts.join(' ');
    };
    f('phone').addEventListener('input', e => {
      const d = e.target.value.replace(/\D/g, '');
      e.target.value = fmt(d.slice(0, d[0] === '0' ? 11 : 10));
      setErr('phone', '');
    });
    ['name', 'email', 'quantity'].forEach(n => f(n).addEventListener('input', () => setErr(n, '')));

    form.addEventListener('submit', async e => {
      e.preventDefault();
      const o = OT[state.lang];
      const name = f('name').value.trim();
      const email = f('email').value.trim();
      const digits = f('phone').value.replace(/\D/g, '');
      const qty = Number(f('quantity').value);
      let ok = true;

      setErr('name', name ? '' : o.required);
      if (!name) ok = false;

      if (!email && !digits) {
        setErr('email', o.contact); setErr('phone', o.contact); ok = false;
      } else {
        const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email);
        const phoneOk = digits.length === 10 || (digits.length === 11 && digits[0] === '0');
        setErr('email', email && !emailOk ? o.emailErr : '');
        setErr('phone', digits && !phoneOk ? o.phoneErr : '');
        if (email && !emailOk) ok = false;
        if (digits && !phoneOk) ok = false;
      }

      const qtyOk = Number.isInteger(qty) && qty >= 1 && qty <= 50;
      setErr('quantity', qtyOk ? '' : o.qtyErr);
      if (!qtyOk) ok = false;

      status.textContent = '';
      status.className = 'order-status';
      if (!ok) return;

      btn.disabled = true;
      status.textContent = o.sending;
      try {
        const res = await fetch('https://api.web3forms.com/submit', {
          method: 'POST', body: new FormData(form), headers: { Accept: 'application/json' }
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.success) {
          form.reset();
          f('quantity').value = 1;
          status.textContent = o.ok;
          status.className = 'order-status ok';
        } else {
          status.textContent = o.error;
          status.className = 'order-status bad';
        }
      } catch (err) {
        status.textContent = o.error;
        status.className = 'order-status bad';
      } finally {
        btn.disabled = false;
      }
    });
  }

  function setNav(which) {
    document.getElementById('navStore').classList.toggle('on', which === 'store');
  }

  function route() {
    const id = location.hash.slice(1);
    const p = PRODUCTS.find(x => x.id === id);
    if (p) renderProduct(p); else renderStore();
    applyChrome();
  }

  function applyChrome() {
    const u = UI[state.lang];
    document.documentElement.lang = state.lang;
    document.querySelectorAll('.tx').forEach(el => el.textContent = el.dataset[state.lang]);
    document.getElementById('langBtn').textContent = state.lang === 'tr' ? 'EN' : 'TR';
    document.getElementById('footerText').textContent = u.footer;
  }

  document.getElementById('langBtn').addEventListener('click', () => { state.lang = state.lang === 'tr' ? 'en' : 'tr'; route(); });
  document.getElementById('themeBtn').addEventListener('click', () => {
    const root = document.documentElement;
    const dark = root.getAttribute('data-theme') === 'dark';
    root.setAttribute('data-theme', dark ? 'light' : 'dark');
    document.getElementById('themeBtn').textContent = dark ? '🌙' : '☀️';
  });
  document.getElementById('navStore').addEventListener('click', e => { e.preventDefault(); location.hash = ''; route(); });
  window.addEventListener('hashchange', route);
  route();
</script>
<script src="roket.js"></script>
</body>
